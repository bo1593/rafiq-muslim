
name: Build Rafiq Muslim APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o rafiq-muslim-android-project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: rafiq-android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-muslim-apk
          path: rafiq-android/app/build/outputs/apk/debug/app-debug.apk
